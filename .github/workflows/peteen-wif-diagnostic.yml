name: PETEEN WIF Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  id-token: write

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 1 &&
      github.actor == 'vhlokao' &&
      startsWith(github.event.comment.body, '[PETEEN-WIF-DIAG]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print selected GitHub OIDC claims and test Anthropic token exchange
        uses: actions/github-script@v8
        env:
          FEDERATION_RULE_ID: fdrl_013zxuD9Jw2BWqHHwqj1xscr
          ANTHROPIC_ORGANIZATION_ID: d77d149b-b52e-4598-8bf7-1cbcbecdd19e
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0146yweQrbRDsPdVT4eonW3N
        with:
          script: |
            const jwt = await core.getIDToken('https://api.anthropic.com');
            const parts = jwt.split('.');
            if (parts.length !== 3) throw new Error('Unexpected OIDC token shape');

            const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            const safeKeys = [
              'iss', 'sub', 'aud', 'repository', 'repository_owner',
              'ref', 'workflow', 'actor', 'event_name', 'job_workflow_ref'
            ];
            const safeClaims = {};
            for (const key of safeKeys) safeClaims[key] = claims[key] ?? null;
            core.info(`SAFE_OIDC_CLAIMS=${JSON.stringify(safeClaims)}`);

            const body = {
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion: jwt,
              federation_rule_id: process.env.FEDERATION_RULE_ID,
              organization_id: process.env.ANTHROPIC_ORGANIZATION_ID,
              service_account_id: process.env.ANTHROPIC_SERVICE_ACCOUNT_ID,
            };

            const response = await fetch('https://api.anthropic.com/v1/oauth/token', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body),
            });

            const raw = await response.text();
            let parsed;
            try { parsed = JSON.parse(raw); } catch { parsed = { raw }; }

            if (response.ok) {
              core.info(`WIF_EXCHANGE=PASS status=${response.status} token_type=${parsed.token_type ?? 'unknown'} expires_in=${parsed.expires_in ?? 'unknown'} scope=${parsed.scope ?? 'unknown'}`);
              return;
            }

            const safeError = {
              status: response.status,
              type: parsed?.error?.type ?? null,
              message: parsed?.error?.message ?? parsed?.message ?? null,
              request_id: parsed?.request_id ?? null,
            };
            core.error(`WIF_EXCHANGE=FAIL ${JSON.stringify(safeError)}`);
            core.setFailed(`Anthropic WIF token exchange failed with HTTP ${response.status}`);
